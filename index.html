
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pertamaku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }

        button {
            background: #4785e8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Halo, Hanafi! 👋</h1>
        <p>Ini halaman HTML pertamaku.</p>

        <button onclick="sapa()">
            Klik Saya
        </button>
    </div>

    <script>
        function sapa() {
            alert("Halo! Selamat belajar HTML 😁");
        }
    </script>

</body>
</html>
